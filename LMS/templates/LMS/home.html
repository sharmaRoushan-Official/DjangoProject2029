<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(to right, #667eea, #764ba2);
            color: #fff;
            margin: 0;
            padding: 0;
        }

        h1 {
            margin-top: 30px;
            letter-spacing: 2px;
        }

        hr {
            width: 60%;
            border: 1px solid #fff;
            margin-bottom: 30px;
        }

        table {
            border-collapse: collapse;
            width: 70%;
            background-color: #ffffff;
            color: #333;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }

        th {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            font-size: 16px;
        }

        tr:first-child th {
            background-color: #4a69bd;
            color: #fff;
            font-size: 18px;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        a {
            text-decoration: none;
            color: #4a69bd;
            font-weight: bold;
            transition: 0.3s;
        }

        a:hover {
            color: #e55039;
            text-decoration: underline;
        }
    </style>
</head>

<body align="center">

    <h1>WELCOME TO LMS DASHBOARD</h1>
    <hr>

    <table border="2px solid black" align="center">
        <tr>
            <th>PAGE NAME</th>
            <th>REFERENCES</th>
        </tr>

        <tr>
            <th>HOME</th>
            <th><a href="{% url 'home' %}">Home Page</a></th>
        </tr>

        <tr>
            <th>USER NAME</th>
            <th>LINK</th>
        </tr>

        <tr>
            <th>REGISTER</th>
            <th><a href="{% url 'register' %}">Register</a></th>
        </tr>

        <tr>
            <th>SECURE1</th>
            <th><a href="{% url 'secure1' %}">Secure1</a></th>
        </tr>

        <tr>
            <th>SECURE2</th>
            <th><a href="{% url 'secure2' %}">Secure2</a></th>
        </tr>

        <tr>
            <th>UNSECURE1</th>
            <th><a href="{% url 'unsecure1' %}">Unsecure1</a></th>
        </tr>

        <tr>
            <th>UNSECURE2</th>
            <th><a href="{% url 'unsecure2' %}">Unsecure2</a></th>
        </tr>

        <tr>
            <th>LOGIN</th>
            <th>LINK</th>
        </tr>

        <tr>
            <th>LOGOUT</th>
            <th>LINK</th>
        </tr>
    </table>

</body>
</html>
